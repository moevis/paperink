name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先卡行数：超线的文件直接红掉，别等评审时才发现又长回去了
      - name: Check file sizes
        run: ./scripts/check-size.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK：runner 镜像自带 cmdline-tools，直接用它的 sdkmanager 装。
      #
      # 这里不用 android-actions/setup-android@v3——那个 action 默认去装
      # `tools` 包，而 Google 已经把这个包从 SDK 仓库里下架了，于是这一步
      # 必然失败（2026-11 实测：流水线红在 setup-android，build 根本没跑）。
      # 换成自己调 sdkmanager，装什么写什么。
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager：$ANDROID_HOME/cmdline-tools 下没有这个文件" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      # 只跑 debug 与单测：release 需要打包者自己的签名，CI 上产不出可用包。
      # -Pandroid.builder.sdkDownload=true 是兜底：万一上面漏装了什么组件，
      # AGP 会自己把缺的补上，而不是直接报「package not found」。
      - name: Build and test
        run: >-
          ./gradlew :app:assembleDebug :app:testDebugUnitTest
          -Pandroid.builder.sdkDownload=true
          --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: paperink-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
